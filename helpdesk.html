<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>CWA Help Desk Appointments</title>   
    </head>
</html>
<body>
    <a href="http://www.swin.edu.au">
         <img src="swin_logo.png" alt="Swinburne University Logo" width="200">
    </a>
    <h1>CWA Help Desk Appointments</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>
    <form action="submit.php" method="post">
        <fieldset>
            <legend>Student details</legend>
            <label for="Student ID">Student ID:</label>
            <input type="text" id="Student ID" name="Student ID" required pattern="[0-9]{7,10}">
            <br><br>
            <label for="givenname">Given Name</label>
                <input type="text" id="givenname" name="givenname" maxlength="15"required pattern="[A-Za-z]+">
                <label for="familyname">Family Name</label>
                <input type="text" id="familyname" name="familyname" maxlength="15" required pattern="[A-Za-z]+">
        </fieldset>
        <fieldset>
            <legend>Your unit</legend>
            <input type="radio" id="cos10011" name="unit" value="COS10011" required>
            <label for="cos10011">COS10011</label>
            <input type="radio" id="cos60004" name="unit" value="COS60004">
            <label for="cos60004">COS60004</label>
            <input type="radio" id="cos60007" name="unit" value="COS60007">
            <label for="cos60007">COS60007</label>
            <br><br>
            <label for="tutor">Your Tutor</label>
            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="alice">Alice</option>
                <option value="bob">Bob</option>
                <option value="carla">Carla</option>
            </select>
        </fieldset>
   <fieldset>
      <legend>Issue</legend>

      <label for="html">HTML</label>
      <input type="checkbox" id="html" name="html" checked>

      <label for="css">CSS</label>
      <input type="checkbox" id="css" name="css">

      <label for="javascript">JavaScript</label>
      <input type="checkbox" id="javascript" name="javascript">

      <label for="php">PHP</label>
      <input type="checkbox" id="php" name="php">

      <label for="mysql">MySQL</label>
      <input type="checkbox" id="mysql" name="mysql">
      <br><br>

      <label for="description">Description of Issue</label><br>
      <textarea id="description" name="description" rows="5" cols="40"
                placeholder="Write description of your problem here..."></textarea>
    </fieldset>

    <fieldset>
      <legend>Preferred Date / Time</legend>


      <label for="date">Date</label>
      <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
      <br>

      <label for="time">Time</label>
      <input type="text" id="time" name="time" placeholder="00:00" pattern="[0-9]{2}:[0-9]{2}">
    </fieldset>

    <input type="submit" value="Book">
    <input type="reset" value="Reset form">

  </form>

</body>
</html>
